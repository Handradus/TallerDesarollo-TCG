server {
    listen 80;
    server_name cartateca.cl www.cartateca.cl;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cartateca.cl www.cartateca.cl;

    ssl_certificate /etc/letsencrypt/live/cartateca.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartateca.cl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    

    # Serve React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Backend Container
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy WebSocket (Socket.io)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Serve Uploaded Images (Shared Volume)
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex off;
    }
}
